<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOOER GE300 AI - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { 
      darkMode: 'class', 
      theme: { 
        extend: { 
          colors: { 
            brand: { bg: '#050a14', accent: '#00ff66', accentHover: '#00cc52', cyan: '#00e5ff', text: '#e2e8f0', muted: '#64748b' } 
          } 
        } 
      } 
    };
  </script>
  <style>
    body {
      background-color: #050a14;
      background-image: radial-gradient(circle at 15% 30%, rgba(0, 255, 102, 0.12) 0%, transparent 40%), radial-gradient(circle at 85% 60%, rgba(0, 229, 255, 0.12) 0%, transparent 40%), linear-gradient(to bottom, rgba(5, 10, 20, 0.8), rgba(5, 10, 20, 1));
      color: #e2e8f0;
    }
    .glass-panel {
      background: rgba(10, 15, 30, 0.45);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .neon-border-btn {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 102, 0.4);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .neon-border-btn:hover { border-color: rgba(0, 255, 102, 0.8); box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); }
    .neon-border-btn.cyan-variant { border-color: rgba(0, 229, 255, 0.4); }
    .neon-border-btn.cyan-variant:hover { border-color: rgba(0, 229, 255, 0.8); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
    .input-neon {
      background: transparent; border: none; border-bottom: 2px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease;
    }
    .input-neon:focus { outline: none; border-bottom: 2px solid #00ff66; }
    .input-neon.pwd:focus { border-bottom: 2px solid #00e5ff; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">
  
  <div class="glass-panel w-full max-w-sm rounded-3xl p-8 z-10 flex flex-col relative">
    
    <!-- Cabecera -->
    <div class="flex items-center gap-4 mb-2">
      <div class="w-12 h-12 rounded-xl border border-brand-accent/40 flex items-center justify-center text-brand-accent shadow-[0_0_15px_rgba(0,255,102,0.2)]">
        <i class="fa-solid fa-guitar text-xl"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold tracking-wider leading-tight">MOOER GE300</h2>
        <h3 class="text-sm font-mono text-brand-muted tracking-widest">AI TONE STUDIO</h3>
      </div>
    </div>
    <p class="text-xs text-brand-muted mb-8 tracking-wide">Smart Access to Your Sound</p>

    <!-- Botones Sociales -->
    <div class="space-y-4 mb-8">
      <!-- ID AÑADIDO PARA LA LÓGICA -->
      <button id="btn-google" class="neon-border-btn cyan-variant w-full py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 text-sm font-semibold tracking-wide">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
    

  <!-- SCRIPT DE FIREBASE Y LÓGICA DE LOGIN -->
  <script type="module">
    // 1. Importar los módulos de Firebase directo desde internet (sin instalar nada)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    // 2. Las credenciales de tu proyecto (Caja fuerte)
    const firebaseConfig = {
      apiKey: "AIzaSyDMZxIgDvBRJNyIZuo3CDwnyvx1INm7LsM",
      authDomain: "mooer-ai-tone-studio.firebaseapp.com",
      projectId: "mooer-ai-tone-studio",
      storageBucket: "mooer-ai-tone-studio.firebasestorage.app",
      messagingSenderId: "666841738973",
      appId: "1:666841738973:web:2c0937a5b2a51b143c3534"
    };

    // 3. Encender Firebase y la Autenticación
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 4. Activar el Botón de Google
    const btnGoogle = document.getElementById('btn-google');
    
    btnGoogle.addEventListener('click', async () => {
      try {
        // Abre la ventanita de Google
        const resultado = await signInWithPopup(auth, provider);
        const usuario = resultado.user;
        
        // ¡Éxito!
        // Redirigir a la pedalera principal
window.location.href = "index.html";

        // (En el futuro, aquí agregaremos la redirección hacia la pantalla de la pedalera)
      } catch (error) {
        console.error("Error al iniciar sesión:", error);
        alert("Authentication failed.");
      }
    });
  </script>
</body>
    </html>
