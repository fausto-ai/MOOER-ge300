<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOOER GE300 - Community Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- HEADER MOOER GE300 -->
    <header class="sticky top-0 z-30 bg-[#090d16]/95 backdrop-blur border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                <i class="fas fa-guitar"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-sm tracking-tight text-white">MOOER <span class="text-emerald-400">GE300</span></h1>
                <p class="text-[10px] text-gray-400">Community Hub & Preset Forum</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span id="user-nick-badge" class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-lg font-mono">
                @guitarrista
            </span>
            <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-gray-300 px-3 py-1.5 rounded-lg border border-slate-700">
                <i class="fas fa-arrow-left mr-1"></i> Volver
            </a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-xl mx-auto p-4 space-y-4">

        <!-- CAJA DE PUBLICACIÓN (FREE & PRO) -->
        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
                    <i class="fas fa-comments"></i> Publicar Comentario o Ajuste
                </h2>
                <span id="plan-badge" class="text-[10px] bg-slate-800 text-gray-300 px-2 py-0.5 rounded font-semibold">
                    FREE / PRO
                </span>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-gray-400 block mb-1">Tu Nickname (del correo)</label>
                    <input id="post-nick" type="text" placeholder="@tu_nickname" 
                        class="w-full bg-[#090d16] border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono focus:border-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 block mb-1">Preset / Canción (Opcional)</label>
                    <input id="post-preset" type="text" placeholder="Ej: Metallica One / 01A" 
                        class="w-full bg-[#090d16] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none">
                </div>
            </div>

            <!-- Valoración con decimales opcional para el preset comentado -->
            <div class="flex items-center justify-between bg-[#090d16] border border-slate-800/80 rounded-xl px-3 py-2">
                <span class="text-[11px] text-gray-400"><i class="fas fa-star text-amber-400 mr-1"></i> Puntuar tono:</span>
                <div class="flex items-center gap-2">
                    <input id="post-rating" type="range" min="3.5" max="5.0" step="0.1" value="4.9" 
                        oninput="document.getElementById('rating-val').innerText = parseFloat(this.value).toFixed(1)"
                        class="w-24 accent-amber-400 cursor-pointer">
                    <span id="rating-val" class="text-xs font-bold text-amber-400 font-mono w-7 text-right">4.9</span>
                </div>
            </div>

            <textarea id="post-text" rows="3" placeholder="Comparte tus correcciones de perillas, pide un preset o deja tu sugerencia para la comunidad GE300..." 
                class="w-full bg-[#090d16] border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-emerald-500 focus:outline-none"></textarea>

            <button onclick="sendPost()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-2.5 rounded-xl text-xs transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
                <i class="fas fa-paper-plane"></i> Publicar en Comunidad
            </button>
        </div>

        <!-- MURO DE COMENTARIOS EN VIVO -->
        <div class="flex items-center justify-between px-1 pt-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400">Comentarios Recientes</h3>
            <span id="post-count" class="text-[10px] text-emerald-400 font-mono">En vivo</span>
        </div>

        <div id="feed-container" class="space-y-3">
            <!-- Se llena automáticamente -->
        </div>

    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (4 BOTONES IGUAL QUE LINE 6) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#090d16]/95 backdrop-blur border-t border-slate-800/80 px-6 py-2.5 flex justify-around items-center z-40">
        <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-emerald-400 transition-colors">
            <i class="fas fa-sliders-h text-lg mb-1"></i>
            <span class="text-[10px] font-medium">Tone AI</span>
        </a>
        <a href="index.html#library" class="flex flex-col items-center text-gray-500 hover:text-emerald-400 transition-colors">
            <i class="fas fa-book text-lg mb-1"></i>
            <span class="text-[10px] font-medium">Library</span>
        </a>
        <a href="community.html" class="flex flex-col items-center text-emerald-400">
            <i class="fas fa-users text-lg mb-1"></i>
            <span class="text-[10px] font-bold">Community</span>
        </a>
        <a href="index.html#tools" class="flex flex-col items-center text-gray-500 hover:text-emerald-400 transition-colors">
            <i class="fas fa-calculator text-lg mb-1"></i>
            <span class="text-[10px] font-medium">Tools</span>
        </a>
    </nav>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN FIREBASE (O MODO LOCAL SI NO ESTÁ CONECTADO)
        // Si quieres que sincronice en la nube con tu Firebase de MOOER, 
        // pega aquí el mismo bloque firebaseConfig de tu index.html:
        // ==========================================
        const firebaseConfig = {
            // Pega aquí tu apiKey, authDomain, projectId, etc. de tu index.html
        };

        let db = null;
        try {
            if (firebaseConfig.apiKey) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            }
        } catch (e) { console.log("Usando almacenamiento híbrido"); }

        // ==========================================
        // 2. EXTRAER NICKNAME DEL CORREO AUTOMÁTICAMENTE
        // ==========================================
        function initUser() {
            const savedEmail = localStorage.getItem('user_email') || localStorage.getItem('mooer_user_email') || '';
            const savedNick = localStorage.getItem('mooer_comm_nick') || '';
            const isPro = localStorage.getItem('mooer_pro_status') === 'true' || localStorage.getItem('isPro') === 'true';

            let nick = savedNick;
            if (!nick && savedEmail.includes('@')) {
                nick = '@' + savedEmail.split('@')[0].replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
            }
            if (!nick) {
                nick = '@Guitarrista_' + Math.floor(100 + Math.random() * 899);
            }

            document.getElementById('post-nick').value = nick;
            document.getElementById('user-nick-badge').innerText = nick;
            const planBadge = document.getElementById('plan-badge');
            if (isPro) {
                planBadge.innerHTML = '👑 PRO MEMBER';
                planBadge.className = 'text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded font-bold';
            } else {
                planBadge.innerHTML = '🎸 FREE MEMBER';
            }

            if (firebase.apps.length > 0) {
                firebase.auth().onAuthStateChanged(user => {
                    if (user && user.email) {
                        const emailNick = '@' + user.email.split('@')[0].replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
                        document.getElementById('post-nick').value = emailNick;
                        document.getElementById('user-nick-badge').innerText = emailNick;
                        localStorage.setItem('mooer_comm_nick', emailNick);
                    }
                });
            }
        }

        // Comentarios iniciales de ejemplo para que nunca se vea vacío
        const defaultPosts = [
            {
                nick: "@fausto_ai",
                isPro: true,
                preset: "Bienvenida MOOER GE300",
                rating: "5.0",
                text: "¡Bienvenidos al Community Hub de MOOER GE300! Aquí pueden dejar sus ajustes de perillas, puntuar tonos o pedir correcciones de canciones.",
                date: "Fijado"
            },
            {
                nick: "@wes_nu_metal",
                isPro: false,
                preset: "Limp Bizkit - Livin' It Up",
                rating: "4.9",
                text: "Para la intro limpia usen pastilla Neck + US Clean con Gain en 25, Chorus al 30% y Reverb Plate largo. ¡Suena idéntico al disco!",
                date: "Hace 2 h"
            }
        ];

        function renderPosts(posts) {
            const container = document.getElementById('feed-container');
            container.innerHTML = posts.map(p => `
                <div class="bg-[#111827] border border-slate-800/90 rounded-2xl p-4 space-y-2 shadow-md">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-emerald-400 font-mono">${p.nick}</span>
                            ${p.isPro 
                                ? '<span class="text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.5 rounded font-bold">PRO</span>' 
                                : '<span class="text-[9px] bg-slate-800 text-gray-400 px-1.5 py-0.5 rounded">FREE</span>'}
                        </div>
                        <span class="text-[10px] text-gray-500">${p.date || 'Reciente'}</span>
                    </div>
                    <div class="flex items-center justify-between bg-[#090d16] px-2.5 py-1.5 rounded-lg border border-slate-800/60">
                        <span class="text-[11px] font-semibold text-gray-300"><i class="fas fa-sliders-h text-emerald-400 mr-1.5"></i>${p.preset || 'General GE300'}</span>
                        <span class="text-xs font-bold text-amber-400 font-mono"><i class="fas fa-star mr-1"></i>${parseFloat(p.rating || 4.9).toFixed(1)}</span>
                    </div>
                    <p class="text-xs text-gray-200 leading-relaxed whitespace-pre-line pt-1">${p.text}</p>
                </div>
            `).join('');
        }

        function loadPosts() {
            if (db) {
                db.collection('mooer_ge300_community').orderBy('timestamp', 'desc').limit(50).onSnapshot(snap => {
                    const cloudPosts = [];
                    snap.forEach(doc => cloudPosts.push(doc.data()));
                    renderPosts([...cloudPosts, ...defaultPosts]);
                });
            } else {
                const local = JSON.parse(localStorage.getItem('mooer_comm_posts') || '[]');
                renderPosts([...local, ...defaultPosts]);
            }
        }

        async function sendPost() {
            const nickInput = document.getElementById('post-nick');
            const presetInput = document.getElementById('post-preset');
            const ratingInput = document.getElementById('post-rating');
            const textInput = document.getElementById('post-text');

            let nick = nickInput.value.trim() || '@guitarrista';
            if (!nick.startsWith('@')) nick = '@' + nick;
            localStorage.setItem('mooer_comm_nick', nick);

            const text = textInput.value.trim();
            if (!text) return alert('Escribe tu comentario o sugerencia antes de publicar 🎸');

            const newPost = {
                nick: nick,
                isPro: localStorage.getItem('mooer_pro_status') === 'true',
                preset: presetInput.value.trim() || 'General GE300',
                rating: parseFloat(ratingInput.value).toFixed(1),
                text: text,
                date: 'Ahora mismo',
                timestamp: Date.now()
            };

            if (db) {
                await db.collection('mooer_ge300_community').add(newPost);
            } else {
                const local = JSON.parse(localStorage.getItem('mooer_comm_posts') || '[]');
                local.unshift(newPost);
                localStorage.setItem('mooer_comm_posts', JSON.stringify(local));
                loadPosts();
            }

            textInput.value = '';
            presetInput.value = '';
        }

        initUser();
        loadPosts();
    </script>
</body>
</html>
