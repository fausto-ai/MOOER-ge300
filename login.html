  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMZxIgDvBRJNyIZuo3CDwnvyx1INm7LsM",
      authDomain: "mooer-ai-tone-studio.firebaseapp.com",
      projectId: "mooer-ai-tone-studio",
      storageBucket: "mooer-ai-tone-studio.firebasestorage.app",
      messagingSenderId: "666841738973",
      appId: "1:666841738973:web:2c0937a5b2a51b143c3534"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Comprobar si regresamos de la redirección de Google
    getRedirectResult(auth)
      .then((result) => {
        if (result) {
          window.location.href = "index.html";
        }
      }).catch((error) => {
        console.error("Error en redirección:", error);
      });

    const btnGoogle = document.getElementById('btn-google');
    
    btnGoogle.addEventListener('click', async () => {
      try {
        // Usamos redirect en lugar de popup para evitar bloqueos en el celular
        await signInWithRedirect(auth, provider);
      } catch (error) {
        console.error("Error al iniciar sesión:", error);
        alert("Autenticación fallida: " + error.message);
      }
    });
  </script>
